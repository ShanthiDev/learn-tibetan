# Learn Tibetan — Quell-Curriculum (von Hand gepflegt).
#
# Hier steht nur, was NICHT generierbar ist. Wylie, TZ-Aussprache und Silbenanalyse erzeugt
# `uv run learn-tibetan build-content` mit der Referenz-Engine (src/learn_tibetan/phonetics/).
# Fachlich unsichere Angaben sind mit Kommentar markiert und dürfen jederzeit korrigiert werden.

[alphabet]
note_de = """Die tibetische Schrift entstand im 7. Jahrhundert nach indischem Vorbild. Die ersten vier \
Reihen folgen der Ordnung der indischen Grammatiker (Artikulationsort, je unbehaucht – behaucht – \
ursprünglich stimmhaft – nasal), wie im Devanagari. Heutiges Tibetisch klingt nicht wie \
klassisches Sanskrit: ཅ ཆ ཇ etwa werden als tsch/dsch gesprochen, ག ད བ eher tief und weich."""

[[groups]]
id = "velar"
label_de = "Kehllaute"
linguistic = "velar · Hintergaumen (traditionell „guttural“)"
letters = [
  { tibetan = "ཀ", devanagari = "क", aspiration = "unbehaucht", tone = "hoch", hint_de = "k ohne Hauchstoß, wie in „Skat“" },
  { tibetan = "ཁ", devanagari = "ख", aspiration = "behaucht", tone = "hoch", hint_de = "k mit deutlichem Hauch, wie in „Kahn“" },
  { tibetan = "ག", devanagari = "ग", aspiration = "je nach Aussprache", tone = "tief", hint_de = "Zwei Aussprachen sind verbreitet: (A) wie ཁ „kha“ mit Hauch, nur mit tiefem Ton (Lhasa, Exil); (B) weich: g wie in „gut“. Wylie und TZ schreiben „ga“." },
  { tibetan = "ང", devanagari = "ङ", tone = "tief", hint_de = "ng wie in „singen“, auch am Silbenanfang" },
]

[[groups]]
id = "palatal"
label_de = "Gaumenlaute"
linguistic = "palatal · heute als Affrikaten tsch/dsch gesprochen"
letters = [
  { tibetan = "ཅ", devanagari = "च", aspiration = "unbehaucht", tone = "hoch", hint_de = "tsch ohne Hauch" },
  { tibetan = "ཆ", devanagari = "छ", aspiration = "behaucht", tone = "hoch", hint_de = "tsch mit Hauch" },
  { tibetan = "ཇ", devanagari = "ज", aspiration = "je nach Aussprache", tone = "tief", hint_de = "Zwei Aussprachen sind verbreitet: (A) wie ཆ „tscha“ mit Hauch, nur mit tiefem Ton (Lhasa, Exil); (B) weich: dsch wie in „Dschungel“. Wylie und TZ schreiben „dscha“. ཆ „Paar“ und ཇ „Tee“ unterscheidet dann nur der Ton." },
  { tibetan = "ཉ", devanagari = "ञ", tone = "tief", hint_de = "nj wie in „Cognac“ oder spanisch ñ" },
]

[[groups]]
id = "dental"
label_de = "Zahn-/Zahndammlaute"
linguistic = "dental/alveolar"
letters = [
  { tibetan = "ཏ", devanagari = "त", aspiration = "unbehaucht", tone = "hoch", hint_de = "t ohne Hauch, wie in „Stall“" },
  { tibetan = "ཐ", devanagari = "थ", aspiration = "behaucht", tone = "hoch", hint_de = "t mit Hauch, wie in „Tal“" },
  { tibetan = "ད", devanagari = "द", aspiration = "je nach Aussprache", tone = "tief", hint_de = "Zwei Aussprachen sind verbreitet: (A) wie ཐ „tha“ mit Hauch, nur mit tiefem Ton (Lhasa, Exil); (B) weich: d wie in „Dach“. Wylie und TZ schreiben „da“." },
  { tibetan = "ན", devanagari = "न", tone = "tief", hint_de = "n" },
]

[[groups]]
id = "labial"
label_de = "Lippenlaute"
linguistic = "labial"
letters = [
  { tibetan = "པ", devanagari = "प", aspiration = "unbehaucht", tone = "hoch", hint_de = "p ohne Hauch, wie in „Spiel“" },
  { tibetan = "ཕ", devanagari = "फ", aspiration = "behaucht", tone = "hoch", hint_de = "p mit Hauch, wie in „Paar“" },
  { tibetan = "བ", devanagari = "ब", aspiration = "je nach Aussprache", tone = "tief", hint_de = "Zwei Aussprachen sind verbreitet: (A) wie ཕ „pha“ mit Hauch, nur mit tiefem Ton (Lhasa, Exil); (B) weich: b wie in „Bach“. Wylie und TZ schreiben „ba“. Nach einer anderen Silbe oft w (später im Kapitel Silben)." },
  { tibetan = "མ", devanagari = "म", tone = "tief", hint_de = "m" },
]

[[groups]]
id = "sibilant-affricates"
label_de = "Zischlaute (tibetische Ergänzung)"
linguistic = "dentale Affrikaten ts – tsh – dz, dazu w"
# ཙ ཚ ཛ sind tibetische Neubildungen ohne eigene Devanagari-Entsprechung; in Sanskrit-Umschrift
# schreibt man mit ihnen च छ ज (z. B. བཛྲ vajra). Daher nur als Notiz, nicht als Parallele.
letters = [
  { tibetan = "ཙ", devanagari_note = "kein eigenes Devanagari; schreibt in Sanskrit च", aspiration = "unbehaucht", tone = "hoch", hint_de = "ts ohne Hauch. Wie ཅ, aber mit kleiner Fahne oben rechts" },
  { tibetan = "ཚ", devanagari_note = "kein eigenes Devanagari; schreibt in Sanskrit छ", aspiration = "behaucht", tone = "hoch", hint_de = "ts mit Hauch. Wie ཆ, aber mit Fahne" },
  { tibetan = "ཛ", devanagari_note = "kein eigenes Devanagari; schreibt in Sanskrit ज", aspiration = "unbehaucht", tone = "tief", hint_de = "dz mit tiefem Ton; manche sprechen ein behauchtes ts. Wie ཇ, aber mit Fahne" },
  { tibetan = "ཝ", devanagari = "व", tone = "tief", hint_de = "w, eher wie englisch „water“" },
]

[[groups]]
id = "row6"
label_de = "Weiche Reibelaute, a-chung, ya"
linguistic = "stimmhafte Frikative zh/z, a-chung (stumm, Vokalträger), Halbvokal y"
letters = [
  { tibetan = "ཞ", devanagari_note = "keine Entsprechung", tone = "tief", hint_de = "sch mit tiefem Ton; Gegenstück zu ཤ" },
  { tibetan = "ཟ", devanagari_note = "keine Entsprechung", tone = "tief", hint_de = "s mit tiefem Ton; Gegenstück zu ས" },
  { tibetan = "འ", devanagari_note = "keine Entsprechung (tibetischer Vokalträger)", tone = "tief", hint_de = "Kaum ein Konsonant: der Vokal mit weichem, leicht gehauchtem Einsatz, tiefer Ton; Gegenstück zu ཨ" },
  { tibetan = "ཡ", devanagari = "य", tone = "tief", hint_de = "j wie in „ja“" },
]

[[groups]]
id = "row7"
label_de = "Fließ- und Zischlaute"
linguistic = "Liquide r/l, Sibilanten sh/s"
letters = [
  { tibetan = "ར", devanagari = "र", tone = "tief", hint_de = "r, leicht gerollt oder getippt" },
  { tibetan = "ལ", devanagari = "ल", tone = "tief", hint_de = "l" },
  { tibetan = "ཤ", devanagari = "श", tone = "hoch", hint_de = "sch mit hohem Ton" },
  { tibetan = "ས", devanagari = "स", tone = "hoch", hint_de = "stimmloses s mit hohem Ton" },
]

[[groups]]
id = "row8"
label_de = "Hauchlaut und Vokalträger"
linguistic = "h, Vokalträger a"
letters = [
  { tibetan = "ཧ", devanagari = "ह", tone = "hoch", hint_de = "h" },
  { tibetan = "ཨ", devanagari = "अ", tone = "hoch", hint_de = "Nur der Vokal, hoher Ton. Träger für Vokalzeichen (ཨི ཨུ ཨེ ཨོ)" },
]

# Vokalzeichen. "" = inhärentes a (der Buchstabe selbst).
[[vowels]]
id = "a"
sign = ""
name_de = "inhärentes a"
sound_de = "kurzes a, eher wie in „Ball“"
[[vowels]]
id = "i"
sign = "ི"
name_de = "gi gu"
sound_de = "wie ie in „Liebe“"
name_spoken = "khi khu"
name_audio = "audio/extra/vowelname-gigu.mp3"
example = { tibetan = "རི", meaning_de = "Berg", audio = "audio/extra/word-ri.mp3" }
[[vowels]]
id = "u"
sign = "ུ"
name_de = "zhabs kyu"
sound_de = "wie u in „gut“"
name_spoken = "shab kyu"
name_audio = "audio/extra/vowelname-zhabskyu.mp3"
example = { tibetan = "ཆུ", meaning_de = "Wasser", audio = "audio/extra/word-chu.mp3" }
[[vowels]]
id = "e"
sign = "ེ"
name_de = "'greng bu"
sound_de = "wie e in „See“"
name_spoken = "dreng bu"
name_audio = "audio/extra/vowelname-drengbu.mp3"
example = { tibetan = "མེ", meaning_de = "Feuer", audio = "audio/extra/word-me.mp3" }
[[vowels]]
id = "o"
