# Hintergrundwissen, in der App hinter ⓘ (Alphabet). Eigene Formulierungen; Inhalt angelehnt an
# gängige Lehrwerke (Vorlage: references/texts/, nicht im Repo). Absätze mit Leerzeile trennen.
[[topics]]
id = "default-a"
title_de = "Das inhärente a und der Tsheg"
text_de = """Jeder Konsonant wird mit einem kurzen a gesprochen, obwohl dafür kein Zeichen geschrieben wird: ཀ ist „ka“. \
Erst ein Vokalzeichen ersetzt dieses a (ཀི ཀུ ཀེ ཀོ).

Der Punkt ་ nach jeder Silbe heißt Tsheg. Er trennt Silben, ähnlich wie ein Leerzeichen, und wird nicht gesprochen. \
Tibetisch hat keine Groß- und Kleinbuchstaben, und die Konsonanten haben keine eigenen Namen: Man liest sie einfach, \
wie sie klingen."""

[[topics]]
id = "aspiration"
title_de = "Behauchung"
text_de = """Manche Konsonanten werden mit einem kleinen Luftstoß gesprochen (behaucht), andere ohne (unbehaucht). \
Im Deutschen gibt es beides, nur achtet niemand darauf: Das k in „Kahn“ ist behaucht, das k in „Skat“ nicht. \
Halte die Hand vor den Mund und sprich beide Wörter, dann spürst du den Unterschied.

Im Tibetischen unterscheidet die Behauchung Wörter: ཀ་བ (Säule) und ཁ་བ (Schnee) unterscheiden sich nur darin. \
In jeder der ersten Reihen steht deshalb ein unbehauchter und ein behauchter Buchstabe nebeneinander: ཀ/ཁ, ཅ/ཆ, ཏ/ཐ, པ/ཕ, ཙ/ཚ. \
Wylie markiert die Behauchung mit h (kha, tha), „TZ aktuell“ ebenfalls."""

[[topics]]
id = "tone"
title_de = "Ton"
text_de = """Zentraltibetisch kennt zwei Töne. Der hohe Ton ist kurz, klar und fällt oft leicht ab. Der tiefe Ton ist länger, \
ruhiger und steigt oft leicht an. Welcher Ton eine Silbe hat, bestimmt der Buchstabe; hörbar wird er am Vokal.

So unterscheiden sich ཆ „Paar“ (hoch) und ཇ „Tee“ (tief) nur im Ton, ebenso ཤ/ཞ (sch), ས/ཟ (s) und ཨ/འ (a). \
Weder Wylie noch die TZ-Umschrift schreiben den Ton. Man muss ihn also am Buchstaben erkennen, und dabei hilft das Hören."""

[[topics]]
id = "ga-kha"
title_de = "ག ཇ ད བ: zwei Aussprachen"
text_de = """Die vier Buchstaben ག ཇ ད བ (jeweils der dritte in den ersten Reihen) werden heute auf zwei Arten gesprochen.

(A) Lhasa- und Exil-Aussprache: Sie klingen wie ihr behauchter Nachbar, nur mit tiefem Ton. ག klingt wie ཁ „kha“, ཇ wie ཆ „tscha“, ད wie ཐ „tha“, བ wie ཕ „pha“. Von ཁ unterscheidet sich ག dann nur durch den Ton.

(B) Weiche Aussprache, älter und weit verbreitet: ག wie g in „gut“, ཇ wie dsch in „Dschungel“, ད wie d in „Dach“, བ wie b in „Bach“. So waren sie im Sanskrit gemeint (ग ज द ब).

Wylie (ga, ja, da, ba) und die TZ-Umschrift (ga, dscha, da, ba) schreiben sie wie in (B). Hörst du bei einem \
Lehrer ein tiefes „kha“, kann das trotzdem ག sein."""

[[topics]]
id = "representations"
title_de = "Schrift, Wylie, TZ und Klang"
text_de = """Die App zeigt bewusst vier Dinge getrennt: die tibetische Schrift, die Wylie-Umschrift (gibt die Buchstaben \
wieder, z. B. ca), die TZ-Umschrift (eine deutsche Lesehilfe für die Aussprache, z. B. tscha) und den Klang.

Abgefragt wird Wylie, weil es eindeutig ist: Jeder Buchstabe hat genau eine Wylie-Form. In der TZ-Umschrift fallen \
manche Buchstaben zusammen (ཅ und ཆ sind beide „tscha“), und Ton sowie Behauchung fehlen ganz."""
