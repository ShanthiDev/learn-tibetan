[project]
name = "learn-tibetan"
version = "0.1.0"
description = "Build-time content pipeline (Tibetan -> Wylie/TZ) for the Learn Tibetan web app"
readme = "README.md"
authors = [
    { name = "ShanthiDev", email = "114111933+ShanthiDev@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
learn-tibetan = "learn_tibetan:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
